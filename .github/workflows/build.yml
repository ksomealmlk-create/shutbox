name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build
        run: |
          unzip -q ShutBox*.zip -d proj
          find proj -maxdepth 3 | head -30
          cd "$(dirname "$(find proj -name settings.gradle | head -1)")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShutBox-APK
          path: proj/**/app-debug.apk
