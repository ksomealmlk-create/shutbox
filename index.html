<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>أغلق الصندوق</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;color:#fff;font-family:system-ui,sans-serif;text-align:center;background:radial-gradient(ellipse at 50% 35%,#4a3a2a,#17110b 75%)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
#stage{perspective:1100px;perspective-origin:50% 40%;width:min(96vw,64vh,560px);aspect-ratio:1}
#board{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(24deg);border-radius:16px;padding:2.5%;display:grid;grid-template-columns:1fr 3.2fr 1fr;grid-template-rows:1fr 3.2fr 1fr;gap:1.5%;
 background:repeating-linear-gradient(92deg,#b98a50 0 7px,#c99a60 7px 12px,#a97c44 12px 17px);
 box-shadow:0 1px #7a5128,0 2px #7a5128,0 3px #6e4822,0 4px #6e4822,0 5px #62401d,0 6px #62401d,0 7px #573918,0 8px #573918,0 9px #4a3014,0 30px 40px #000a,inset 0 0 0 3px #d9ae74,inset 0 0 14px #0006}
#felt{grid-area:2/2;transform-style:preserve-3d;position:relative;--s:clamp(26px,7vw,42px);border-radius:10px;background:radial-gradient(ellipse at 50% 45%,#2f9a52,#14663a 70%,#0d4a2a);box-shadow:inset 0 0 22px #000b,inset 0 0 0 3px #7a5128,0 0 0 2px #d9ae74}
.row{display:flex;gap:3.5%;padding:3%;border-radius:8px;opacity:.6;transition:.25s;background:#0003;box-shadow:inset 0 3px 8px #0009}
.row.act{opacity:1;box-shadow:inset 0 3px 8px #0009,0 0 18px 4px #ffe9a0}
#p0{grid-area:3/2;--c:#4a9bff;--d:#1b4f9c;--r:0deg}
#p1{grid-area:2/1;flex-direction:column;--c:#ffd23a;--d:#a07f00;--r:90deg}
#p2{grid-area:1/2;flex-direction:row-reverse;--c:#4fd070;--d:#1c7a37;--r:180deg}
#p3{grid-area:2/3;flex-direction:column-reverse;--c:#ff5a55;--d:#9a2220;--r:-90deg}
.t{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:5px;color:#fff;font-size:clamp(11px,3.4vw,22px);cursor:pointer;
 background:linear-gradient(160deg,var(--c),var(--d));text-shadow:0 1px 2px #0008;transition:transform .2s,box-shadow .2s,filter .2s;
 box-shadow:0 1px 0 var(--d),0 2px 0 var(--d),0 3px 0 var(--d),0 4px 0 var(--d),0 5px 0 var(--d),0 7px 6px #000a,inset 0 1px 1px #fff8;transform:translateY(-2px)}
.t span{display:block;transform:rotate(var(--r))}
.t.s{transform:translateY(-9px);filter:brightness(1.35);box-shadow:0 1px 0 var(--d),0 2px 0 var(--d),0 3px 0 var(--d),0 4px 0 var(--d),0 5px 0 var(--d),0 14px 10px #000b,0 0 14px #fff}
.t.x{transform:translateY(3px);box-shadow:inset 0 2px 5px #000c;filter:brightness(.3);color:transparent;pointer-events:none}
.dw{position:absolute;width:var(--s);height:var(--s);transform-style:preserve-3d;transition:left 1.1s cubic-bezier(.2,.7,.3,1),top 1.1s cubic-bezier(.2,.7,.3,1);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2)}
.sh{position:absolute;inset:8% -4% -12% 8%;background:radial-gradient(#000c,#0000 70%);filter:blur(3px)}
.hp{position:absolute;inset:0;transform-style:preserve-3d}.hp.go{animation:hop 1.2s ease-out}
@keyframes hop{0%{transform:translateZ(0)}35%{transform:translateZ(110px)}60%{transform:translateZ(0)}75%{transform:translateZ(30px)}100%{transform:translateZ(0)}}
.cu{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.15,.7,.25,1)}
.f{position:absolute;inset:0;border-radius:11%;background:linear-gradient(145deg,#fffdf6,#d8d2c2);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:15%;box-shadow:inset 0 0 9px #0005;backface-visibility:hidden}
.f b.o{background:radial-gradient(circle at 35% 30%,#555,#000);border-radius:50%;margin:8%}
.f1{transform:translateZ(calc(var(--s)/2))}.f6{transform:rotateY(180deg) translateZ(calc(var(--s)/2));filter:brightness(.82)}
.f3{transform:rotateY(90deg) translateZ(calc(var(--s)/2));filter:brightness(.9)}.f4{transform:rotateY(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.78)}
.f2{transform:rotateX(90deg) translateZ(calc(var(--s)/2));filter:brightness(.95)}.f5{transform:rotateX(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.8)}
#felt,#felt *{pointer-events:none}
.bt{position:relative;z-index:10;margin-top:34px}
#msg{min-height:28px;font-size:19px;text-shadow:0 2px 4px #000}
button{font:inherit;font-size:19px;padding:12px 26px;border:0;border-radius:14px;background:linear-gradient(#4a9bff,#1b5fc0);color:#fff;box-shadow:0 4px 0 #0f3a78,0 8px 12px #0008}
button:disabled{filter:grayscale(1) brightness(.6)}
#mu{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:10px;padding:8px 14px}
#menu{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,#4a3a2a,#17110b 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5}
</style></head><body>
<div id="menu"><h1>🎲 أغلق الصندوق</h1><div>عدد اللاعبين</div>
<div style="display:flex;gap:12px"><button onclick="start(2)">2</button><button onclick="start(3)">3</button><button onclick="start(4)">4</button></div>
<p style="max-width:300px;line-height:1.6">اضرب الزار، اقلب الأرقام اللي مجموعها = الزار. اللي يبقى عليه أقل مجموع يفوز.</p></div>
<button id="mu" onclick="toggleMu()">🔊</button><div id="msg"></div>
<div id="stage"><div id="board"><div class="row" id="p2"></div><div class="row" id="p1"></div><div id="felt"></div><div class="row" id="p3"></div><div class="row" id="p0"></div></div></div>
<div class="bt"><button id="roll" onclick="roll()">🎲 اضرب الزار</button> <button id="ok" onclick="confirmSel()">تأكيد</button></div>
<script>
const N=["الأزرق","الأصفر","الأخضر","الأحمر"],ids=[0,1,2,3],$=id=>document.getElementById(id);
let n,cur,open,sel,dice,scores,phase,ac,mg,mute=false;
const ord=()=>n==2?[0,2]:n==3?[0,1,2]:[0,1,2,3];
function say(t){$('msg').textContent=t}
/* ---------- صوت وموسيقى ---------- */
const SC=[293.66,311.13,369.99,392,440,466.16,523.25,587.33],
MEL=[4,-1,5,4,3,-1,2,1,0,-1,1,2,3,-1,-1,-1,4,5,6,5,4,-1,3,2,1,-1,2,1,0,-1,-1,-1],DR="DT.T D.T.".replace(' ','');
function initAudio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.4;mg.connect(ac.destination);
 const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;ac.nb=nb;
 let st=0,nt=ac.currentTime+.1;setInterval(()=>{while(nt<ac.currentTime+.4){tune(st,nt);nt+=.3;st++}},120)}
function env(g,t,v,dur){g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur)}
function pluck(f,t,v,dur){const o=ac.createOscillator(),fl=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(2400,t);fl.frequency.exponentialRampToValueAtTime(300,t+dur);env(g,t,v,dur);o.connect(fl);fl.connect(g);g.connect(mg);o.start(t);o.stop(t+dur)}
function noise(t,dur,hp,v){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=ac.nb;f.type='highpass';f.frequency.value=hp;env(g,t,v,dur);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+dur)}
function tune(st,t){const m=MEL[st%32];if(m>=0)pluck(SC[m],t,.22,.7);if(st%8==0)pluck(146.83,t,.3,1.6);
 const k=st%8;if(k==0||k==4){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);env(g,t,.7,.25);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.25)}
 if(k==1||k==3||k==6)noise(t,.06,4000,.18)}
function click(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=900;env(g,t,.3,.08);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.1)}
function rattle(){if(!ac)return;for(let i=0;i<9;i++)noise(ac.currentTime+i*.11+Math.random()*.04,.05,1500+Math.random()*2500,.5)}
function toggleMu(){mute=!mute;if(mg)mg.gain.value=mute?0:.4;$('mu').textContent=mute?'🔇':'🔊'}
document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()});
/* ---------- الزار ثلاثي الأبعاد ---------- */
const P={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]},R={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]};
function mk(){const d=document.createElement('div');d.className='dw';
 d.innerHTML='<div class="sh"></div><div class="hp"><div class="cu">'+[1,6,3,4,2,5].map(v=>`<div class="f f${v}">${[1,2,3,4,5,6,7,8,9].map(c=>`<b${P[v].includes(c)?' class="o"':''}></b>`).join('')}</div>`).join('')+'</div></div>';return d}
function throwDice(vals){const f=$('felt');f.innerHTML='';
 vals.forEach((v,i)=>{const d=mk();d.style.left='-12%';d.style.top=(25+Math.random()*50)+'%';f.appendChild(d);
  void d.offsetWidth;const hp=d.querySelector('.hp'),cu=d.querySelector('.cu');hp.classList.add('go');
  d.style.left=(vals.length==1?50:34+i*32)+Math.random()*6+'%';d.style.top=(38+Math.random()*24)+'%';
  cu.style.transform=`rotateZ(${Math.random()*360|0}deg) rotateX(${R[v][0]+720}deg) rotateY(${R[v][1]+720}deg)`})}
/* ---------- اللعبة ---------- */
function draw(){const o=ord();
 ids.forEach(p=>{const r=$('p'+p);r.style.display=o.includes(p)?'flex':'none';r.className='row'+(p==o[cur]?' act':'');r.innerHTML='';
  for(let v=1;v<=9;v++){const e=document.createElement('div');e.className='t'+(open[p].includes(v)?'':' x')+(p==o[cur]&&sel.includes(v)?' s':'');e.innerHTML='<span>'+v+'</span>';r.appendChild(e)}});
 $('roll').disabled=phase!='roll';$('ok').disabled=phase!='pick'}
function start(k){initAudio();if(ac.state=='suspended')ac.resume();n=k;cur=0;open=ids.map(()=>[1,2,3,4,5,6,7,8,9]);scores={};sel=[];dice=null;phase='roll';$('menu').style.display='none';$('felt').innerHTML='';draw();say('دور '+N[0])}
function can(o,t,i=0){if(t==0)return true;if(t<0)return false;for(let j=i;j<o.length;j++)if(can(o,t-o[j],j+1))return true;return false}
function roll(){const p=ord()[cur],o=open[p],one=[7,8,9].every(v=>!o.includes(v)),r=()=>1+Math.random()*6|0;
 dice=one?[r()]:[r(),r()];sel=[];phase='anim';draw();rattle();throwDice(dice);say('...');
 setTimeout(()=>{const t=dice.reduce((a,b)=>a+b);
  if(!can(o,t)){say('ما في حركة! مجموعك '+o.reduce((a,b)=>a+b,0));setTimeout(()=>endTurn(false),1600);return}
  phase='pick';say('اختر أرقام مجموعها '+t);draw()},1300)}
function pick(p,v){if(phase!='pick'||p!=ord()[cur]||!open[p].includes(v))return;click();sel=sel.includes(v)?sel.filter(x=>x!=v):[...sel,v];draw()}
function confirmSel(){const t=dice.reduce((a,b)=>a+b);if(sel.reduce((a,b)=>a+b,0)!=t){say('المجموع لازم يكون '+t);return}
 const p=ord()[cur];open[p]=open[p].filter(v=>!sel.includes(v));sel=[];dice=null;phase='roll';draw();click();
 if(!open[p].length){say('🎉 أغلقت الصندوق!');setTimeout(()=>endTurn(true),1200);return}say('اضرب مرة ثانية')}
function endTurn(win){const p=ord()[cur];scores[cur]=win?0:open[p].reduce((a,b)=>a+b,0);dice=null;sel=[];cur++;
 if(cur>=n){const b=Math.min(...Object.values(scores)),w=Object.keys(scores).filter(k=>scores[k]==b).map(k=>N[ord()[k]]);phase='end';draw();
  say('🏆 الفائز: '+w.join(' و ')+' ('+b+') — '+Object.keys(scores).map(k=>N[ord()[k]]+':'+scores[k]).join(' | '));$('roll').textContent='لعبة جديدة';$('roll').disabled=false;$('roll').onclick=()=>location.reload();return}
 phase='roll';$('felt').innerHTML='';draw();say('دور '+N[ord()[cur]])}
function tapAt(x,y){if(phase!='pick')return;const p=ord()[cur];
 for(const e of $('p'+p).children){const r=e.getBoundingClientRect();
  if(x>=r.left&&x<=r.right&&y>=r.top-6&&y<=r.bottom+6){pick(p,+e.textContent);return}}}
document.addEventListener('pointerup',e=>tapAt(e.clientX,e.clientY));
</script></body></html>
